## This docker-compose.yml file defines two services: 'api' for the FastAPI application and 'postgres' for the PostgreSQL database. 
## The 'api' service depends on the 'postgres' service, which ensures that the database is healthy before the API starts. 
## Both services are connected to a shared network, and the PostgreSQL data is persisted using a named volume.
## Shared network is what nginx is connected to, so that nginx can route requests to the api container.
services:
  api:
    build: .
    container_name: fastapi
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

volumes:
  pgdata:

networks:
  shared-network:
    external: true